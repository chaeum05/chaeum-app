<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>채움영어 출석 체크</title>
<link rel="manifest" href="/checkin.webmanifest">
<meta name="theme-color" content="#7a1f2b">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="채움 출석">
<link rel="apple-touch-icon" href="/icons/icons/checkin-180.png">
<link rel="icon" href="/icons/icons/checkin-192.png">
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
:root {
  --cream:#faf6ef; --paper:#ffffff; --ink:#221c17; --sub:#8a7f74; --line:#ece4d8;
  --wine:#7a1f2b; --wine2:#5a1520; --gold:#c9a24b; --gold2:#e8cf8f;
  --in1:#0f5132; --in2:#198754; --out1:#1e2f6b; --out2:#3355c4; --warn1:#8a5a00; --warn2:#d9921a; --err1:#7f1d1d; --err2:#c2410c;
  --serif:'Do Hyeon', 'Pretendard', sans-serif; --sans:'Pretendard', 'Noto Sans KR', sans-serif;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--cream); color:var(--ink); font-family:var(--sans); user-select:none; -webkit-user-select:none; overflow:hidden; }

/* ── 화면 배치: 가로(태블릿 눕힘) = 왼쪽 브랜드 / 오른쪽 키패드, 세로 = 위아래 ── */
.wrap { height:100%; display:grid; grid-template-columns: minmax(300px, 40%) 1fr; }
.brand { position:relative; background:radial-gradient(120% 90% at 20% 10%, #8f2a37 0%, var(--wine) 45%, var(--wine2) 100%); color:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(28px,4vw,56px); overflow:hidden; }
.brand::before { content:''; position:absolute; inset:clamp(14px,1.6vw,22px); border:1px solid rgba(232,207,143,.45); border-radius:18px; pointer-events:none; }
.brand::after { content:''; position:absolute; width:520px; height:520px; right:-200px; bottom:-220px; border-radius:50%; background:radial-gradient(circle, rgba(232,207,143,.18), transparent 65%); pointer-events:none; }
.b-top .acad { font-family:var(--serif); font-size:clamp(12px,1.3vw,15px); letter-spacing:.42em; color:var(--gold2); }
.b-top .name { font-family:var(--serif); font-weight:900; font-size:clamp(28px,3.4vw,44px); margin-top:8px; letter-spacing:-.01em; }
.b-top .rule { width:56px; height:2px; background:var(--gold); margin-top:18px; border-radius:2px; }
.b-mid { position:relative; z-index:1; }
.b-mid .time { font-family:var(--serif); font-weight:700; font-size:clamp(64px,9vw,128px); line-height:1; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.b-mid .date { font-size:clamp(16px,1.8vw,22px); margin-top:10px; color:rgba(255,255,255,.82); font-weight:500; }
.b-mid .greet { font-size:clamp(17px,1.9vw,24px); margin-top:22px; font-weight:700; color:#fff; }
.b-bot { font-family:var(--serif); font-size:clamp(13px,1.3vw,16px); color:var(--gold2); letter-spacing:.06em; position:relative; z-index:1; }

.panel { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(14px,2.2vh,22px); padding:clamp(18px,3vw,40px); }
.p-title { font-family:var(--serif); font-weight:900; font-size:clamp(26px,3.2vw,40px); letter-spacing:-.01em; }
.hint { color:var(--sub); font-size:clamp(14px,1.6vw,18px); min-height:1.4em; text-align:center; margin-top:-8px; }
.dots { display:flex; gap:clamp(14px,2vw,22px); margin:4px 0 6px; }
.dot { width:clamp(20px,2.4vw,28px); height:clamp(20px,2.4vw,28px); border-radius:50%; border:2.5px solid #cfc3b3; background:transparent; transition:all .15s ease; }
.dot.on { background:var(--gold); border-color:var(--gold); transform:scale(1.08); box-shadow:0 0 0 6px rgba(201,162,75,.16); }
.dots.shake { animation:shake .35s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
.pad { display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,1.6vh,18px); width:min(620px, 100%, calc((100vh - 300px) * 1.08)); }
.k { aspect-ratio:1.45; border:1px solid var(--line); border-radius:22px; background:var(--paper); color:var(--ink); font-size:clamp(28px,5.2vh,56px); font-weight:700; font-family:var(--sans); cursor:pointer; box-shadow:0 1px 0 rgba(0,0,0,.02), 0 6px 16px rgba(90,60,30,.07); transition:transform .06s ease, background .1s ease, color .1s ease; font-variant-numeric:tabular-nums; }
.k:active { transform:scale(.96); background:var(--wine); color:#fff; border-color:var(--wine); }
.k.fn { font-size:clamp(15px,1.6vw,19px); font-weight:500; background:transparent; color:var(--sub); box-shadow:none; border-color:transparent; }
.k.fn:active { background:#efe7da; color:var(--ink); }
.busy .pad, .busy .dots { opacity:.45; pointer-events:none; }

@media (orientation: portrait), (max-width: 820px) {
  .wrap { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
  .brand { flex-direction:row; align-items:flex-end; padding:clamp(22px,4vw,36px) clamp(22px,5vw,44px); }
  .brand::before { inset:10px; }
  .b-mid { text-align:right; } .b-mid .time { font-size:clamp(48px,11vw,84px); } .b-mid .greet { display:none; }
  .b-bot { display:none; }
  .pad { width:min(560px,92vw); gap:clamp(12px,2.4vw,20px); }
  .k { aspect-ratio:1.3; font-size:clamp(34px,6vw,52px); }
  .hbtn { top:auto; bottom:12px; right:auto; left:14px; }
}

/* ── 결과 화면 ── */
.result { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; text-align:center; padding:24px; color:#fff; z-index:20; }
.result.show { display:flex; animation:fadein .18s ease; }
@keyframes fadein { from{opacity:0} to{opacity:1} }
.result.in   { background:radial-gradient(120% 100% at 50% 0%, var(--in2), var(--in1)); }
.result.out  { background:radial-gradient(120% 100% at 50% 0%, var(--out2), var(--out1)); }
.result.warn { background:radial-gradient(120% 100% at 50% 0%, var(--warn2), var(--warn1)); }
.result.err  { background:radial-gradient(120% 100% at 50% 0%, var(--err2), var(--err1)); }
.result .icon { width:clamp(84px,11vw,128px); height:clamp(84px,11vw,128px); border-radius:50%; background:rgba(255,255,255,.16); display:flex; align-items:center; justify-content:center; font-size:clamp(44px,6vw,68px); margin-bottom:8px; animation:pop .4s cubic-bezier(.2,1.6,.4,1); box-shadow:0 0 0 12px rgba(255,255,255,.06); }
@keyframes pop { from{transform:scale(.3);opacity:0} to{transform:scale(1);opacity:1} }
.result .mid { font-size:clamp(20px,2.8vw,32px); font-weight:700; opacity:.95; }
.result .big { font-family:var(--serif); font-size:clamp(56px,9vw,112px); font-weight:900; line-height:1.1; letter-spacing:-.02em; }
.result .time { font-size:clamp(22px,3vw,36px); font-weight:700; font-variant-numeric:tabular-nums; }
.result .chip { display:inline-block; margin-top:6px; padding:8px 18px; border-radius:999px; background:rgba(255,255,255,.16); font-size:clamp(16px,2vw,22px); font-weight:700; }
.result .small { font-size:clamp(14px,1.6vw,18px); opacity:.85; margin-top:4px; }
.result .bar { position:absolute; left:0; bottom:0; height:6px; background:rgba(255,255,255,.55); width:100%; transform-origin:left; }
.result .bar.go { animation:bar var(--dur, 2.5s) linear forwards; }
@keyframes bar { from{transform:scaleX(1)} to{transform:scaleX(0)} }

/* ── 고르기 (동명이인 / 등원·하원 묻기) ── */
.choose { position:fixed; inset:0; background:rgba(34,28,23,.55); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:24px; z-index:15; }
.choose.show { display:flex; animation:fadein .15s ease; }
.choose .q { font-family:var(--serif); font-size:clamp(26px,3.4vw,38px); font-weight:900; color:#fff; margin-bottom:2px; text-shadow:0 2px 12px rgba(0,0,0,.25); }
.choose button { min-width:min(460px,88vw); padding:20px; border:none; border-radius:20px; background:var(--paper); color:var(--ink); font-size:clamp(21px,2.6vw,28px); font-weight:700; font-family:var(--sans); box-shadow:0 10px 30px rgba(0,0,0,.18); }
.choose button small { display:block; font-size:.58em; opacity:.75; font-weight:500; margin-top:4px; }
.choose button[style*="background"] { color:#fff; }
.choose .cancel { background:transparent; color:#fff; box-shadow:none; font-size:18px; opacity:.85; }

.status { position:fixed; bottom:10px; right:14px; font-size:11px; color:#b3a796; z-index:5; }
.fsbtn { position:fixed; top:16px; left:18px; padding:9px 14px; border:1px solid rgba(232,207,143,.5); background:rgba(0,0,0,.15); color:#e8cf8f; border-radius:12px; font-size:13px; font-family:var(--sans); cursor:pointer; z-index:5; }
.is-fs .fsbtn { display:none; }
.hbtn { position:fixed; top:16px; right:18px; padding:9px 14px; border:1px solid var(--line); background:rgba(255,255,255,.7); color:var(--sub); border-radius:12px; font-size:13px; font-family:var(--sans); cursor:pointer; z-index:5; }

/* ── 출결 이력 (선생님용) ── */
.hist { position:fixed; inset:0; background:var(--cream); color:var(--ink); display:none; flex-direction:column; z-index:30; }
.hist.show { display:flex; }
.hist-top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:14px 18px; background:var(--wine); color:#fff; }
.hist-top b { font-family:var(--serif); font-size:20px; margin-right:8px; }
.hist-top button, .hist-top input { padding:9px 13px; border:none; border-radius:10px; font-size:15px; font-family:var(--sans); }
.hist-top button { background:rgba(255,255,255,.14); color:#fff; cursor:pointer; }
.hist-top .close { margin-left:auto; background:var(--gold2); color:var(--ink); font-weight:700; }
.hist-sum { display:flex; gap:8px; flex-wrap:wrap; padding:12px 18px; }
.hist-sum span { padding:7px 14px; border-radius:999px; font-size:14px; font-weight:700; background:#efe7da; }
.hist-sum .s-in { background:#dff3e6; color:#0f5132; } .hist-sum .s-out { background:#e2e8fb; color:#1e2f6b; } .hist-sum .s-no { background:#fbefd6; color:#8a5a00; } .hist-sum .s-ab { background:#f9dede; color:#7f1d1d; }
.hist-body { flex:1; overflow-y:auto; padding:0 18px 24px; }
.hist-sec { font-size:13px; font-weight:800; color:var(--sub); margin:16px 0 8px; letter-spacing:.02em; }
.hist-tbl { width:100%; border-collapse:collapse; background:var(--paper); border-radius:14px; overflow:hidden; font-size:15px; box-shadow:0 4px 14px rgba(90,60,30,.06); }
.hist-tbl th { background:#f6f0e6; color:var(--sub); font-size:12px; text-align:left; padding:9px 12px; font-weight:700; }
.hist-tbl td { padding:11px 12px; border-top:1px solid #f3ece1; }
.hist-tbl td.t { font-weight:700; font-variant-numeric:tabular-nums; }
.hist-tbl .muted { color:#d6ccbe; font-weight:400; }
.tag { display:inline-block; padding:3px 9px; border-radius:7px; font-size:12px; font-weight:700; }
.tag.출석 { background:#dff3e6; color:#0f5132; } .tag.결석 { background:#f9dede; color:#7f1d1d; } .tag.보강, .tag.보강완료, .tag.시험기간보강 { background:#fbefd6; color:#8a5a00; } .tag.none { background:#f3ece1; color:#a89c8d; }
.pinbox { position:fixed; inset:0; background:rgba(34,28,23,.6); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:#fff; z-index:25; }
.pinbox.show { display:flex; }
.pinbox input { font-size:32px; width:220px; text-align:center; letter-spacing:.4em; padding:12px; border-radius:14px; border:none; font-family:var(--sans); }
.pinbox button { padding:12px 24px; border:none; border-radius:12px; font-size:17px; font-family:var(--sans); }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <aside class="brand">
    <div class="b-top">
      <div class="acad">CHAEUM ENGLISH</div>
      <div class="name">채움영어학원</div>
      <div class="rule"></div>
    </div>
    <div class="b-mid">
      <div class="time" id="clock-time">--:--</div>
      <div class="date" id="clock-date"></div>
      <div class="greet" id="greet"></div>
    </div>
    <div class="b-bot">형곡동은 채움입니다.</div>
  </aside>
  <main class="panel">
    <div class="p-title">출석 체크</div>
    <div class="hint" id="hint">출석번호 4자리를 눌러주세요</div>
    <div class="dots" id="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="pad" id="pad"></div>
  </main>
</div>
<button class="fsbtn" id="fsbtn" onclick="goFullscreen()">⛶ 전체화면</button>
<div class="result" id="result"></div>
<div class="choose" id="choose"></div>
<div class="status" id="status"></div>
<button class="hbtn" onclick="histAsk()">📋 출결 이력</button>
<div class="pinbox" id="pinbox">
  <div style="font-size:22px;font-weight:800;">선생님 비밀번호</div>
  <input type="password" inputmode="numeric" id="pin-in" maxlength="8" onkeydown="if(event.key==='Enter')histCheck()">
  <div style="display:flex;gap:10px;"><button onclick="histCheck()" style="background:#FEE500;font-weight:700;">확인</button><button onclick="histPinClose()" style="background:#334155;color:#fff;">취소</button></div>
  <div id="pin-err" style="color:#fca5a5;min-height:1.2em;"></div>
</div>
<div class="hist" id="hist">
  <div class="hist-top">
    <b>📋 출결 이력</b>
    <button onclick="histMove(-1)">◀ 전날</button>
    <input type="date" id="hist-date" onchange="histLoad()">
    <button onclick="histMove(1)">다음날 ▶</button>
    <button onclick="histToday()">오늘</button>
    <button onclick="histLoad()">🔄</button>
    <button class="close" onclick="histClose()">✕ 출석 화면으로</button>
  </div>
  <div class="hist-sum" id="hist-sum"></div>
  <div class="hist-body" id="hist-body"></div>
</div>


<script>
let pin = '';
let busy = false;
let resultTimer = null;
let testKind = 'in';   // 🧪 0000 테스트용

// 키패드
const pad = document.getElementById('pad');
['1','2','3','4','5','6','7','8','9','지우기','0','← 한 칸'].forEach(k => {
  const b = document.createElement('button');
  b.className = 'k' + (k.length > 1 ? ' fn' : '');
  b.textContent = k;
  b.onclick = () => press(k);
  pad.appendChild(b);
});
document.addEventListener('keydown', e => {
  if (document.getElementById('pinbox').classList.contains('show') || document.getElementById('hist').classList.contains('show')) return;
  if (/^\d$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('← 한 칸');
  else if (e.key === 'Escape') press('지우기');
});

function press(k) {
  if (busy) return;
  if (document.getElementById('result').classList.contains('show')) hideResult();
  if (k === '지우기') pin = '';
  else if (k === '← 한 칸') pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += k;
  drawDots();
  if (pin.length === 4) submit();
}
function drawDots() {
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i < pin.length));
}

async function submit(pick, mode) {
  busy = true;
  document.getElementById('wrap').classList.add('busy');
  document.getElementById('hint').textContent = '확인 중...';
  try {
    const r = await fetch('/api/checkin', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'checkin', pin, pick, mode, testKind })
    });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '오류가 났어요');
    if (d.choose) { showChoose(d.choose); return; }
    if (d.ask) { showAsk(d, pick); return; }
    if (d.test) testKind = d.kind === 'in' ? 'out' : 'in';   // 테스트 번호는 누를 때마다 등원↔하원
    showResult(d);
  } catch (e) {
    showResult({ kind: 'err', message: e.message });
  } finally {
    busy = false;
    document.getElementById('wrap').classList.remove('busy');
    document.getElementById('hint').textContent = '출석번호 4자리를 눌러주세요';
  }
}

function showChoose(list) {
  const box = document.getElementById('choose');
  box.innerHTML = '<div class="q">누구인가요?</div>';
  list.forEach(s => {
    const b = document.createElement('button');
    b.innerHTML = `${esc(s.name)}<small>${esc(s.type)} ${esc(s.grade)}</small>`;
    b.onclick = () => { box.classList.remove('show'); submit(s.name); };
    box.appendChild(b);
  });
  const c = document.createElement('button');
  c.className = 'cancel'; c.textContent = '취소';
  c.onclick = () => { box.classList.remove('show'); pin = ''; drawDots(); };
  box.appendChild(c);
  box.classList.add('show');
}

// 수업 시작하고 한참 뒤 처음 누른 경우: 지금 온 건지, 집에 가는 건지 물어보기
function showAsk(d, pick) {
  const box = document.getElementById('choose');
  const short = (d.name || '').replace(/\s*\(.*?\)\s*/g, '');
  box.innerHTML = `<div class="q">${esc(short)} 학생, 지금…</div>`;
  const mk = (html, bg, mode) => {
    const b = document.createElement('button');
    b.innerHTML = html; b.style.background = bg; b.style.padding = '26px';
    b.onclick = () => { box.classList.remove('show'); submit(pick, mode); };
    box.appendChild(b);
  };
  mk('🏫 학원에 왔어요<small>등원</small>', '#16a34a', 'in');
  // 하원은 한 번 더 확인 (잘못 누르면 부모님께 하원 알림이 가니까)
  const b2 = document.createElement('button');
  b2.innerHTML = '🏠 집에 가요<small>하원 (올 때 등원을 안 눌렀어요)</small>';
  b2.style.background = '#2563eb'; b2.style.padding = '26px';
  b2.onclick = () => {
    box.innerHTML = `<div class="q">정말 집에 가는 거 맞아요?</div><div style="color:#cbd5e1;font-size:18px;margin-bottom:6px;">부모님께 <b>하원</b> 알림이 가요</div>`;
    const yes = document.createElement('button');
    yes.innerHTML = '네, 집에 가요 🏠'; yes.style.background = '#2563eb'; yes.style.padding = '22px';
    yes.onclick = () => { box.classList.remove('show'); submit(pick, 'out'); };
    const no = document.createElement('button');
    no.innerHTML = '아니요, 지금 왔어요 🏫'; no.style.background = '#16a34a'; no.style.padding = '22px';
    no.onclick = () => { box.classList.remove('show'); submit(pick, 'in'); };
    box.append(yes, no);
  };
  box.appendChild(b2);
  const c = document.createElement('button');
  c.className = 'cancel'; c.textContent = '취소';
  c.onclick = () => { box.classList.remove('show'); pin = ''; drawDots(); };
  box.appendChild(c);
  box.classList.add('show');
  clearTimeout(resultTimer);
  resultTimer = setTimeout(() => { if (box.classList.contains('show')) { box.classList.remove('show'); pin = ''; drawDots(); } }, 20000);
}

function showResult(d) {
  const el = document.getElementById('result');
  const cls = { in: 'in', out: 'out', dup: 'warn', done: 'warn', err: 'err' }[d.kind] || 'warn';
  const short = (d.name || '').replace(/\s*\(.*?\)\s*/g, '');
  let html;
  if (d.kind === 'in') {
    const tag = d.status === '보강완료' ? '보강' : d.status === '시험기간보강' ? '시험기간 보강' : '';
    html = `<div class="icon"><svg viewBox="0 0 24 24" width="56%" height="56%" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="mid">어서 와요!</div><div class="big">${esc(short)}</div>
      <div class="time">등원 ${esc(d.time)}</div>${tag ? `<div class="chip">${tag}</div>` : ''}`;
    speak(`${short} 학생이 등원하였습니다`);
  } else if (d.kind === 'out') {
    html = `<div class="icon">🙌</div><div class="mid">오늘도 수고했어요!</div><div class="big">${esc(short)}</div>
      <div class="time">하원 ${esc(d.time)}</div>` +
      (d.inTime ? `<div class="chip">오늘 학습 시간 ${esc(durText(d.inTime, d.time))}</div>` : '') +
      (d.noIn ? '<div class="small">다음부터는 올 때도 꼭 눌러주세요 🙏</div>' : '');
    speak(`${short} 학생이 하원하였습니다`);
  } else {
    html = `<div class="icon">${d.kind === 'err' ? '!' : 'i'}</div><div class="mid" style="max-width:760px;line-height:1.5;">${esc(d.message || '')}</div>`;
  }
  if (d.test) html += `<div class="small">🧪 테스트 번호예요 — 출결 기록은 남지 않아요${d.alim && d.alim.sent ? ' · 테스트 알림톡 보냄' : ''}</div>`;
  if (d.alim && d.alim.error) html += `<div class="small">⚠️ 학부모 알림을 못 보냈어요 (${esc(d.alim.error)})</div>`;
  else if (d.alim && d.alim.skipped && (d.kind === 'in' || d.kind === 'out')) html += `<div class="small">학부모 알림 안 보냄 (${esc(d.alim.reason || '설정 확인 필요')})</div>`;
  else if (d.alim && d.alim.sent) html += `<div class="small">📲 학부모님께 알림이 갔어요</div>`;
  const dur = d.kind === 'err' ? 3500 : 2500;
  html += `<div class="bar" style="--dur:${dur}ms"></div>`;
  if (d.kind === 'err') { const dots = document.getElementById('dots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake'); }
  el.className = 'result show ' + cls;
  el.innerHTML = html;
  el.onclick = hideResult;
  clearTimeout(resultTimer);
  requestAnimationFrame(() => el.querySelector('.bar')?.classList.add('go'));
  resultTimer = setTimeout(hideResult, dur);
}
function hideResult() {
  document.getElementById('result').classList.remove('show');
  pin = ''; drawDots();
}
function speak(t) {
  try {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ko-KR'; u.rate = 1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
// 학습 시간: "18:02","20:15" → "2시간 13분"
function durText(a, b) {
  const m = t => { const x = String(t || '').match(/^(\d{1,2}):(\d{2})/); return x ? +x[1] * 60 + +x[2] : null; };
  const d = (m(b) ?? NaN) - (m(a) ?? NaN);
  if (!(d >= 0)) return '';
  const h = Math.floor(d / 60), mm = d % 60;
  return h ? `${h}시간${mm ? ' ' + mm + '분' : ''}` : `${mm}분`;
}
function esc(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }


// ── 📋 출결 이력 (선생님용) ──
// ⚠️ 선생님 비밀번호: 바꾸려면 아래 숫자만 고치세요
const ADMIN_PIN = '7773';
let histTimer = null;
const kstToday = () => new Date(Date.now() + 9 * 3600 * 1000).toISOString().slice(0, 10);
function histAsk() {
  let ok = false; try { ok = sessionStorage.getItem('chaeum-hist-ok') === '1'; } catch (e) {}
  if (ok) return histOpen();
  document.getElementById('pin-in').value = ''; document.getElementById('pin-err').textContent = '';
  document.getElementById('pinbox').classList.add('show');
  setTimeout(() => document.getElementById('pin-in').focus(), 50);
}
function histPinClose() { document.getElementById('pinbox').classList.remove('show'); }
function histCheck() {
  if (document.getElementById('pin-in').value !== ADMIN_PIN) { document.getElementById('pin-err').textContent = '비밀번호가 달라요'; return; }
  try { sessionStorage.setItem('chaeum-hist-ok', '1'); } catch (e) {}
  histPinClose(); histOpen();
}
function histOpen() {
  document.getElementById('hist').classList.add('show');
  if (!document.getElementById('hist-date').value) document.getElementById('hist-date').value = kstToday();
  histLoad(); histIdle();
}
function histClose() {
  document.getElementById('hist').classList.remove('show');
  try { sessionStorage.removeItem('chaeum-hist-ok'); } catch (e) {}
  clearTimeout(histTimer);
}
// 2분 동안 아무것도 안 하면 출석 화면으로 돌아가기 (학생들이 보지 않게)
function histIdle() { clearTimeout(histTimer); histTimer = setTimeout(histClose, 120000); }
['click', 'touchstart', 'keydown'].forEach(ev => document.getElementById('hist').addEventListener(ev, histIdle));
function histToday() { document.getElementById('hist-date').value = kstToday(); histLoad(); }
function histMove(n) {
  const el = document.getElementById('hist-date');
  const d = new Date((el.value || kstToday()) + 'T12:00:00');
  d.setDate(d.getDate() + n);
  el.value = d.toISOString().slice(0, 10);
  histLoad();
}
async function histLoad() {
  const date = document.getElementById('hist-date').value || kstToday();
  const body = document.getElementById('hist-body'), sum = document.getElementById('hist-sum');
  body.innerHTML = '<div style="padding:30px;text-align:center;color:#94a3b8;">불러오는 중...</div>'; sum.innerHTML = '';
  try {
    const r = await fetch('/api/get-attendance', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ date }) });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '불러오기 실패');
    const key = s => `${s.name}|${s.type}|${s.grade}`;
    const recs = {}; (d.attendance || []).forEach(a => recs[key(a)] = a);
    const people = new Map();
    [...(d.students || []), ...(d.sessionStudents || [])].forEach(s => people.set(key(s), { name: s.name, type: s.type, grade: s.grade, session: (d.sessionStudents || []).includes(s) }));
    (d.attendance || []).forEach(a => { if (!people.has(key(a))) people.set(key(a), { name: a.name, type: a.type, grade: a.grade }); });
    const rows = [...people.values()].map(p => ({ ...p, rec: recs[key(p)] }));
    const came = rows.filter(r => r.rec && (r.rec.inTime || ['출석', '보강완료', '시험기간보강'].includes(r.rec.status)))
      .sort((a, b) => (a.rec.inTime || '99').localeCompare(b.rec.inTime || '99') || a.name.localeCompare(b.name, 'ko'));
    const absent = rows.filter(r => r.rec && r.rec.status === '결석' && !r.rec.inTime);
    const notYet = rows.filter(r => !came.includes(r) && !absent.includes(r) && !r.session)
      .sort((a, b) => a.name.localeCompare(b.name, 'ko'));
    const outN = came.filter(r => r.rec.outTime).length;
    sum.innerHTML = `<span class="s-in">등원 ${came.length}명</span><span class="s-out">하원 ${outN}명</span><span class="s-no">아직 안 옴 ${notYet.length}명</span><span class="s-ab">결석 ${absent.length}명</span>`;
    const t = v => v ? esc(v) : '<span class="muted">—</span>';
    const tbl = (list, withTime) => `<table class="hist-tbl"><tr><th>이름</th><th>학년</th><th>상태</th>${withTime ? '<th>등원</th><th>하원</th><th>학습 시간</th>' : ''}</tr>` +
      list.map(r => `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.type)} ${esc(r.grade)}</td>
        <td><span class="tag ${r.rec ? esc(r.rec.status) : 'none'}">${r.rec ? esc(r.rec.status) : '미체크'}</span>${r.rec && r.rec.memo ? ` <span style="font-size:12px;color:#64748b;">${esc(r.rec.memo)}</span>` : ''}</td>
        ${withTime ? `<td class="t">${t(r.rec && r.rec.inTime)}</td><td class="t">${t(r.rec && r.rec.outTime)}</td><td class="t">${t(r.rec && r.rec.inTime && r.rec.outTime ? durText(r.rec.inTime, r.rec.outTime) : '')}</td>` : ''}</tr>`).join('') + '</table>';
    let html = '';
    if (came.length) html += `<div class="hist-sec">✅ 등원 (${came.length})</div>` + tbl(came, true);
    if (notYet.length) html += `<div class="hist-sec">⏳ 아직 안 옴 (${notYet.length})</div>` + tbl(notYet, false);
    if (absent.length) html += `<div class="hist-sec">❌ 결석 (${absent.length})</div>` + tbl(absent, false);
    body.innerHTML = html || `<div style="padding:30px;text-align:center;color:#94a3b8;">${d.dayName === '주말' ? '주말 — 아직 출결 기록이 없어요 🌿' : '이 날은 등원 예정 학생이 없어요'}</div>`;
  } catch (e) {
    body.innerHTML = `<div style="padding:30px;text-align:center;color:#ef4444;">${esc(e.message)}</div>`;
  }
}

// 시계 + 시간대 인사
function tick() {
  const n = new Date();
  const days = '일월화수목금토';
  const h = n.getHours();
  document.getElementById('clock-time').textContent = `${String(h).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
  document.getElementById('clock-date').textContent = `${n.getFullYear()}년 ${n.getMonth() + 1}월 ${n.getDate()}일 ${days[n.getDay()]}요일`;
  document.getElementById('greet').textContent =
    h < 12 ? '좋은 아침이에요 ☀️' : h < 17 ? '오늘도 반가워요 👋' : h < 20 ? '오늘도 힘내서 채워봐요 ✏️' : '늦게까지 수고 많아요 🌙';
}
tick(); setInterval(tick, 5000);

// 알림톡 연결 상태 (오른쪽 아래 작게)
fetch('/api/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'status' }) })
  .then(r => r.json()).then(d => {
    document.getElementById('status').textContent = d.alimtalk
      ? '● 학부모 알림톡 켜짐' + ((d.missing || []).includes('SOLAPI_TEMPLATE_OUT') ? ' (하원 템플릿 없음)' : '')
      : '○ 알림톡 꺼짐 — 빠진 설정: ' + ((d.missing || []).filter(k => k !== 'SOLAPI_TEST_PHONE').join(', ') || '?');
  }).catch(() => {});


// ── 전체화면 (진짜 앱처럼) ──
// 홈 화면 아이콘으로 열면 처음부터 전체화면. 브라우저로 열었으면 첫 터치 때 전체화면으로 바꿈
const isStandalone = () => matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement) || isStandalone();
function goFullscreen() {
  if (isFs()) return;
  const el = document.documentElement;
  try { (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el, { navigationUI: 'hide' })?.catch?.(() => {}); } catch (e) {}
  try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch (e) {}
}
function syncFs() { document.body.classList.toggle('is-fs', isFs()); }
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, syncFs));
document.addEventListener('pointerdown', () => { if (!isFs()) goFullscreen(); }, true);   // 아무 데나 누르면 다시 전체화면
syncFs();
// 실수로 뒤로 가기 해도 출석 화면에 머물기
history.pushState(null, '', location.href);
addEventListener('popstate', () => history.pushState(null, '', location.href));

// 화면 꺼짐 방지 (지원하는 기기만)
async function keepAwake() { try { await navigator.wakeLock?.request('screen'); } catch (e) {} }
keepAwake(); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
</script>
